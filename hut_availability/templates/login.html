{% extends "base.html" %}
{% block title %}Admin login · Alta Via availability{% endblock %}
{% block content %}
  <section class="card" style="max-width:460px;margin:8vh auto 0">
    <h1>Admin login</h1>
    <p class="muted">Enter the admin key configured for this private availability service.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input class="sr-only" type="text" name="username" autocomplete="username" value="admin" tabindex="-1" aria-hidden="true">
      <label for="api_key">Admin API key</label>
      <input id="api_key" name="api_key" type="password" autocomplete="current-password" required style="width:100%;margin-bottom:16px">
      <button type="submit">Sign in</button>
    </form>
  </section>
{% endblock %}
