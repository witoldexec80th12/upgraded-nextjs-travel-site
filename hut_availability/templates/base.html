<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>{% block title %}Alta Via availability{% endblock %}</title>
    <style>
      :root { color-scheme: light; --ink:#17211b; --muted:#68746c; --line:#dce3dc; --paper:#f5f7f3; --green:#315c42; --green-soft:#e5f2e7; --amber:#fff0cb; --red:#fae4df; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
      a { color:#24553a; }
      header { background:#fff; border-bottom:1px solid var(--line); }
      .topbar { max-width:1440px; margin:auto; padding:16px 24px; display:flex; justify-content:space-between; gap:16px; align-items:center; }
      .brand { color:var(--ink); text-decoration:none; font-weight:750; letter-spacing:.01em; }
      main { max-width:1440px; padding:28px 24px 56px; margin:auto; }
      h1,h2,h3,p { margin-top:0; }
      h1 { font-size:clamp(1.65rem,3vw,2.2rem); margin-bottom:8px; }
      h2 { font-size:1.15rem; margin-bottom:14px; }
      .muted, small { color:var(--muted); }
      .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin:18px 0; box-shadow:0 2px 8px #18251a08; }
      .row { display:flex; align-items:end; gap:14px; flex-wrap:wrap; }
      .row.spread { justify-content:space-between; align-items:center; }
      label { display:block; font-weight:650; font-size:.9rem; margin-bottom:5px; }
      input,select,button { font:inherit; }
      input[type=date],input[type=number],input[type=password],select { min-height:40px; border:1px solid #cbd5cb; border-radius:7px; padding:7px 10px; background:#fff; color:var(--ink); }
      input[type=number] { width:90px; }
      button,.button { appearance:none; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:7px; padding:10px 15px; background:var(--green); color:#fff; font-weight:700; cursor:pointer; text-decoration:none; }
      button:hover,.button:hover { background:#244a33; color:#fff; }
      .secondary { background:#edf1ec; color:var(--ink); }
      .secondary:hover { background:#e0e7df; color:var(--ink); }
      .checklists { display:flex; gap:24px; flex-wrap:wrap; margin-top:14px; }
      .checklist { min-width:220px; }
      .check { display:flex; gap:8px; align-items:flex-start; margin:7px 0; font-weight:450; }
      .check input { margin-top:4px; }
      .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:9px; }
      table { border-collapse:collapse; width:100%; min-width:760px; background:#fff; }
      th,td { border-bottom:1px solid #e8ede8; border-right:1px solid #eef1ee; padding:9px 10px; text-align:left; vertical-align:top; }
      th { position:sticky; top:0; z-index:1; background:#f1f5f0; font-size:.82rem; white-space:nowrap; }
      td { font-size:.88rem; }
      td.hut-name { min-width:210px; position:sticky; left:0; background:#fff; z-index:1; }
      .status { display:inline-block; padding:3px 7px; border-radius:99px; font-weight:700; font-size:.76rem; white-space:nowrap; }
      .available { background:var(--green-soft); color:#23613b; }
      .partial,.min_stay { background:var(--amber); color:#754f08; }
      .full,.closed { background:#edf0ed; color:#5f6961; }
      .error { background:var(--red); color:#8b3024; }
      .empty { color:#9aa39b; }
      .manual { border-left:3px solid #d9a542; padding:8px 12px; margin:8px 0; background:#fffaf0; }
      .alert { background:#fff1ed; border:1px solid #f1c8be; color:#813c31; border-radius:8px; padding:11px 13px; margin:12px 0; }
      .job-list { display:grid; gap:8px; }
      .job-item { padding:10px 12px; border:1px solid var(--line); border-radius:8px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
      .progress { background:#e7ece7; border-radius:8px; height:12px; overflow:hidden; margin:15px 0; }
      .progress span { display:block; height:100%; background:#4b805b; }
      .actions { display:flex; gap:10px; align-items:center; }
      .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      .actions form { margin:0; }
      @media (max-width:700px) { main { padding:20px 14px 40px; } .topbar { padding:14px; } .card { padding:15px; } }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="topbar">
        <a class="brand" href="/admin">Alta Via 1 · Hut Availability</a>
        {% if is_admin %}
        <div class="actions">
          <a href="/admin" class="secondary button">Availability</a>
          <form method="post" action="/admin/logout">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <button class="secondary" type="submit">Log out</button>
          </form>
        </div>
        {% endif %}
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
